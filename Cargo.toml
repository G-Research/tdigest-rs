[package]
name    = "tdigest-rs"
version = "2.0.0"
edition = "2021"
description = "Mergeable TDigest in Rust with Python bindings"
license = "Apache-2.0"
repository = "https://github.com/G-Research/tdigest-rs"
homepage = "https://github.com/G-Research/tdigest-rs"
documentation = "https://docs.rs/tdigest-rs"
readme = "README.md"
keywords = ["tdigest", "quantile", "cdf", "statistics"]
categories = ["algorithms", "data-structures", "science"]

[lib]
name       = "tdigest_rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = [
  "dep:pyo3",
  "dep:numpy",
  "pyo3/extension-module",
  "pyo3/abi3-py312",
]

[dependencies]
pyo3         = { version = "0.25", features = ["extension-module", "abi3-py312"], optional = true }
numpy        = { version = "0.25.0", optional = true }

# --- Rust essentials ---
bincode = { version = "2.0.1", features = ["serde"] }
ordered-float  = { version = "5.1.0", features = ["serde"] }
rand           = "0.9.2"
rayon          = "1.11"
serde          = { version = "1.0.228", features = ["derive"] }
serde_json     = "1.0.145"
crc32fast      = "1.4.2"

# jemalloc on Linux GNU only (safer TLS flag for some distros)
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
jemallocator = { version = "0.5", features = ["disable_initial_exec_tls"] }

[dev-dependencies]
testdata = { path = "crates/testdata" }
criterion     = "0.5"
bytesize      = "1"
libc          = "0.2"
ctor          = "0.2"
anyhow        = "1.0"
assert_fs     = "1"
predicates    = "3"
assert_cmd    = "2"
tempfile      = "3"

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dev-dependencies]
jemalloc-ctl  = "0.5"


[[bench]]
name = "cdf_quantile_bench"
harness = false

[[bench]]
name = "tdigest_bench"
harness = false

[workspace]
members  = [".", "crates/testdata"]
resolver = "2"

[profile.release]
strip = false
