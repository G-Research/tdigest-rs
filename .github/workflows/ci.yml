name: CI

on:
  push:
  pull_request:
  schedule:
    # Run daily at 02:43 so we get notified if CI is broken before a pull request
    # is submitted.
    - cron: "43 2 * * *"

jobs:
  rust:
    if: github.event_name == 'schedule' || github.event_name == 'push' || github.event.pull_request.head.repo.id != github.event.pull_request.base.repo.id
    uses: ./.github/workflows/rust.yml

  python:
    if: github.event_name == 'schedule' || github.event_name == 'push' || github.event.pull_request.head.repo.id != github.event.pull_request.base.repo.id
    uses: ./.github/workflows/python.yml

  project:
    if: github.event_name == 'schedule' || github.event_name == 'push' || github.event.pull_request.head.repo.id != github.event.pull_request.base.repo.id
    uses: ./.github/workflows/project.yml

  # Virtual job that can be configured as a required check before a PR can be merged.
  # As GitHub considers a check as successful if it is skipped, we need to check its status in
  # another workflow (check-required.yml) and create a check there.
  all-required-checks-done:
    name: All required checks done
    runs-on: ubuntu-latest
    needs:
      - rust
      - python
      - project
    steps:
      - run: echo "All required checks done"

  # PyPI Trusted Publishing does not support reusable workflows: the attestation
  # certificate names this file, so the PyPI publish job must live here and the
  # trusted publisher on PyPI must be configured for ci.yml with the release environment.
  pypi-publish:
    name: Publish to PyPI
    if: ${{ !github.event.repository.fork && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: all-required-checks-done
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: python-package-*
          merge-multiple: true
          path: dist
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b

  release:
    if: ${{ !github.event.repository.fork && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs:
      - all-required-checks-done
      - pypi-publish
    permissions:
      actions: write
      contents: write
    secrets: inherit
    uses: ./.github/workflows/release.yml
