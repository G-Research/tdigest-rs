name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Completed tag CI run whose tested artifacts should be published"
        required: true
        type: string

# Serialize retries, including a manual recovery racing the automatic trigger.
concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  prepare:
    name: Verify release artifacts
    if: >-
      github.repository == 'G-Research/tdigest-rs' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        startsWith(github.event.workflow_run.head_branch, 'v')))
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.source.outputs.run_id }}
      tag: ${{ steps.source.outputs.tag }}
      artifact_ids: ${{ steps.source.outputs.artifact_ids }}
      release_exists: ${{ steps.source.outputs.release_exists }}
    steps:
      # Read the verifier from this trusted workflow revision, never the source run.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify completed tag CI and select its immutable artifacts
        id: source
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const prepare = require('./scripts/prepare_pypi_release.cjs');
            await prepare({github, context, core});

  pypi-publish:
    name: Publish to PyPI
    needs: prepare
    runs-on: ubuntu-latest
    # workflow_run executes on the default branch. Allow main in this environment.
    environment: release
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          run-id: ${{ needs.prepare.outputs.run_id }}
          artifact-ids: ${{ needs.prepare.outputs.artifact_ids }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true
          path: dist
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          attestations: true
          skip-existing: true

  github-release:
    name: Publish GitHub release
    needs: [prepare, pypi-publish]
    if: needs.prepare.outputs.release_exists != 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          run-id: ${{ needs.prepare.outputs.run_id }}
          artifact-ids: ${{ needs.prepare.outputs.artifact_ids }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          files: dist/*
          prerelease: ${{ contains(needs.prepare.outputs.tag, '-') }}
