name: Python
on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  DEFAULT_PYTHON_VERSION: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: 1

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Set up Python ${{ env.DEFAULT_PYTHON_VERSION }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        id: setup-python
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
          check-latest: true
      - name: Lint
        run: pipx run --python '${{ steps.setup-python.outputs.python-path }}' hatch run dev:lint
        working-directory: bindings/python

  test:
    name: Test
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        runner: [ubuntu-latest, macos-15-intel, macos-14, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        id: setup-python
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true
      - name: Test
        run: pipx run --python '${{ steps.setup-python.outputs.python-path }}' hatch run dev:test
        working-directory: bindings/python

  build:
    name: Build
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-musl
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Build
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          command: build
          args: --release
          manylinux: auto
          target: ${{ matrix.target }}
          working-directory: bindings/python
      - name: Upload Python Package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: python-package-${{ matrix.target }}
          path: target/wheels/*.whl
