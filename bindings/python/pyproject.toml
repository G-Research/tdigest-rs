[build-system]
requires = ["maturin>=1.15.0,<2.0"]
build-backend = "maturin"

[project]
name = "tdigest-rs"
dynamic = ["version"]
description = "Rust TDigest with Python, Polars and JNI"
readme = "../../README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.16"
authors = [{ name = "Ingolfur Edvardsson", email = "ingo.edvardsson@gresearch.co.uk" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Rust",
  "Operating System :: OS Independent",
]

dependencies = [
  "numpy>=1.26.4,<3; python_version < '3.13'",
  "numpy>=2.3.4,<3; python_version >= '3.13' and python_version < '3.15'",
  "numpy>=2.5.4,<3; python_version >= '3.15'",
]

[project.optional-dependencies]
polars = ["polars>=1.0.0"]

[project.urls]
Repository = "https://github.com/G-Research/tdigest-rs"
Changelog = "https://github.com/G-Research/tdigest-rs/releases"

[dependency-groups]
dev = [
  "polars==1.44.2",
  "tomli>=2; python_version < '3.11'",
  "pytest>=8.4.2; python_version < '3.15'",
  "pytest>=9.1.1; python_version >= '3.15'",
  "ruff>=0.13.3",
  "pre-commit>=4.3.0",
  "maturin>=1.15.0,<2.0",
  "maturin[patchelf,zig]>=1.15.0,<2.0; sys_platform == 'linux'",
  "numpy>=1.26.4,<3; python_version < '3.13'",
  "numpy>=2.3.4,<3; python_version >= '3.13' and python_version < '3.15'",
  "numpy>=2.5.4,<3; python_version >= '3.15'",
  "scipy>=1.15.3; python_version < '3.15'",
  "scipy>=1.18.1; python_version >= '3.15'",
  "mypy>=1.18.2",
]

[tool.maturin]
manifest-path = "../../Cargo.toml"
features = ["python"]
bindings = "pyo3"
module-name = "tdigest_rs._native"
python-packages = ["tdigest_rs"]
# Unqualified exclusion patterns apply to both wheels and source distributions.
exclude = ["**/__pycache__/**", "**/*.pyc", "**/*.pyo"]
strip = true

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["target","dist","build",".venv",".maturin",".pytest_cache",".ruff_cache"]

[tool.mypy]
python_version = "3.10"
exclude = "(^target/|^build/|^dist/|^\\.venv/|^out/)"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
